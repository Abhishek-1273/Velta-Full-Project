<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="mainGradient" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB347"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140B02"/>
      <stop offset="1" stop-color="#2B1403"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="42" fill="fff"/>

  <!-- Outer Border -->
  <rect x="2" y="2" width="236" height="236" rx="40"
        stroke="#F59E0B" stroke-opacity="1" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="#F59E0B" opacity="0.08"/>
  <circle cx="120" cy="120" r="65" fill="#FDBA74" opacity="0.05"/>

  <!-- Floating Dots -->
  <circle cx="52" cy="58" r="7" fill="#FDBA74" opacity="0.6"/>
  <circle cx="188" cy="52" r="4" fill="#FCD34D" opacity="0.6"/>
  <circle cx="198" cy="182" r="3" fill="#FDBA74" opacity="0.4"/>

  <!-- Bottom Wave -->
  <path d="M26 176C58 160 84 160 120 176C156 192 182 192 214 176V202H26V176Z"
        fill="#F59E0B" opacity="0.12"/>

  <!-- Shark Shape -->
  <path
    d="M42 174C38 124 74 72 120 54C108 88 132 104 158 118C184 132 204 152 214 174H42Z"
    fill="url(#mainGradient)"
    filter="url(#glow)"
  />

  <!-- Fin Highlight -->
  <path
    d="M90 122C98 94 110 72 120 54"
    stroke="white"
    stroke-opacity="0.35"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Analytics Bars -->
  <rect x="74" y="136" width="14" height="38" rx="4" fill="white" opacity="0.92"/>
  <rect x="95" y="120" width="14" height="54" rx="4" fill="white" opacity="0.92"/>
  <rect x="116" y="102" width="14" height="72" rx="4" fill="white" opacity="0.96"/>
  <rect x="137" y="114" width="14" height="60" rx="4" fill="white" opacity="0.92"/>

  <!-- Growth Line -->
  <path
    d="M74 144L102 126L123 108L145 118"
    stroke="white"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="4 4"
    opacity="0.55"
  />

  <!-- Top Shine -->
  <path
    d="M50 32C90 10 150 10 190 32"
    stroke="white"
    stroke-opacity="0.08"
    stroke-width="8"
    stroke-linecap="round"
  />
</svg>

