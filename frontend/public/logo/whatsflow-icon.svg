<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Cyan Gradient -->
    <linearGradient id="flowGradient" x1="30" y1="20" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="42" fill="url(#bgGradient)"/>

  <!-- Border -->
  <rect x="2" y="2" width="236" height="236" rx="40"
        stroke="url(#flowGradient)" stroke-opacity="1" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="92" fill="#22D3EE" opacity="0.08"/>
  <circle cx="120" cy="120" r="68" fill="#67E8F9" opacity="0.05"/>

  <!-- Floating Particles -->
  <circle cx="54" cy="60" r="3" fill="#67E8F9" opacity="0.6"/>
  <circle cx="190" cy="54" r="2.5" fill="#CFFAFE" opacity="0.6"/>
  <circle cx="198" cy="184" r="3" fill="#67E8F9" opacity="0.4"/>

  <!-- Chat Bubble -->
  <rect x="38" y="52" width="164" height="112" rx="28"
        fill="url(#flowGradient)"
        filter="url(#glow)"/>

  <!-- Bubble Tail -->
  <path d="M74 164L56 194L100 166Z"
        fill="url(#flowGradient)"/>

  <!-- Top AI Dots -->
  <circle cx="120" cy="76" r="5" fill="white" opacity="0.95"/>
  <circle cx="137" cy="72" r="3.5" fill="white" opacity="0.55"/>
  <circle cx="103" cy="72" r="3.5" fill="white" opacity="0.55"/>

  <!-- Workflow Nodes -->
  <circle cx="76" cy="116" r="16" fill="#03222D" opacity="0.75"/>
  <circle cx="120" cy="116" r="16" fill="#03222D" opacity="0.75"/>
  <circle cx="164" cy="116" r="16" fill="#03222D" opacity="0.75"/>

  <!-- Connectors -->
  <line x1="92" y1="116" x2="104" y2="116"
        stroke="white" stroke-width="1.5"
        stroke-dasharray="4 4" opacity="0.5"/>

  <line x1="136" y1="116" x2="148" y2="116"
        stroke="white" stroke-width="1.5"
        stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Node Icons -->
  <path d="M72 116H80" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M77 111L82 116L77 121"
        stroke="white" stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M116 116H124" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M121 111L126 116L121 121"
        stroke="white" stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M160 116H168" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M165 111L170 116L165 121"
        stroke="white" stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Bottom Reflection -->
  <ellipse cx="120" cy="205" rx="70" ry="10"
           fill="#22D3EE" opacity="0.08"/>

  <!-- Shine -->
  <path d="M60 34C96 14 144 14 180 34"
        stroke="white"
        stroke-opacity="0.08"
        stroke-width="8"
        stroke-linecap="round"/>
</svg>